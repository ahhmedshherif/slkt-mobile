<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@700;800;900&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "tertiary-fixed-dim": "#5edac7",
              "surface-variant": "#e5e2de",
              "surface-tint": "#99462a",
              "error-container": "#ffdad6",
              "error": "#ba1a1a",
              "on-secondary-container": "#5f6474",
              "secondary-fixed-dim": "#c2c6d8",
              "on-tertiary-fixed-variant": "#005047",
              "outline-variant": "#dbc1b9",
              "on-primary-fixed-variant": "#7a2f15",
              "tertiary": "#006b5f",
              "surface-container-lowest": "#ffffff",
              "surface-container-highest": "#e5e2de",
              "on-error": "#ffffff",
              "on-tertiary-container": "#00312b",
              "inverse-primary": "#ffb59e",
              "primary-fixed": "#ffdbd0",
              "on-tertiary": "#ffffff",
              "on-secondary-fixed-variant": "#424655",
              "background": "#fcf9f5",
              "outline": "#88726c",
              "on-error-container": "#93000a",
              "secondary-fixed": "#dee2f5",
              "on-background": "#1c1c19",
              "surface-dim": "#dcdad6",
              "surface-container": "#f0ede9",
              "secondary-container": "#dee2f5",
              "on-tertiary-fixed": "#00201c",
              "tertiary-container": "#09a493",
              "inverse-on-surface": "#f3f0ec",
              "primary": "#99462a",
              "on-primary-container": "#541400",
              "on-surface": "#1c1c19",
              "on-primary-fixed": "#390b00",
              "surface-container-low": "#f6f3ef",
              "on-surface-variant": "#55433d",
              "on-primary": "#ffffff",
              "inverse-surface": "#31302e",
              "on-secondary": "#ffffff",
              "surface-container-high": "#ebe8e4",
              "secondary": "#595e6e",
              "primary-fixed-dim": "#ffb59e",
              "primary-container": "#d97757",
              "tertiary-fixed": "#7df7e3",
              "surface-bright": "#fcf9f5",
              "surface": "#fcf9f5",
              "on-secondary-fixed": "#161b29"
            },
            fontFamily: {
              "headline": ["Epilogue"],
              "body": ["Plus Jakarta Sans"],
              "label": ["Plus Jakarta Sans"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .otp-input:focus {
            box-shadow: 0 0 0 2px #d97757;
            outline: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background font-body text-on-background min-h-screen flex flex-col items-center">
<!-- Top Navigation Placeholder (Back only for linear flow) -->
<header class="w-full max-w-md px-6 py-8 flex items-center justify-between">
<button class="flex items-center justify-center w-12 h-12 rounded-full bg-surface-container-high text-primary hover:bg-surface-container-highest transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<span class="font-headline font-black text-xl text-primary tracking-tighter">EvntsApp</span>
<div class="w-12"></div> <!-- Spacer for symmetry -->
</header>
<main class="w-full max-w-md px-8 flex flex-col flex-grow">
<!-- Title & Hero Info -->
<section class="mt-8 mb-12">
<h1 class="font-headline text-4xl font-extrabold tracking-tight text-on-surface leading-tight">
                Verify your<br/>phone
            </h1>
<p class="mt-4 text-on-surface-variant body-lg leading-relaxed">
                We've sent a 6-digit secure code to <br/>
<span class="font-bold text-on-surface">+20 102 345 6789</span>
<button class="ml-1 text-primary font-bold underline hover:text-primary-container transition-colors">Change</button>
</p>
</section>
<!-- OTP Input Grid -->
<section class="grid grid-cols-6 gap-3 mb-10">
<input autocomplete="one-time-code" class="otp-input w-full aspect-square text-center font-headline text-2xl font-bold bg-surface-container-highest border-none rounded-lg text-on-surface" maxlength="1" placeholder="-" type="text"/>
<input autocomplete="one-time-code" class="otp-input w-full aspect-square text-center font-headline text-2xl font-bold bg-surface-container-highest border-none rounded-lg text-on-surface" maxlength="1" placeholder="-" type="text"/>
<input autocomplete="one-time-code" class="otp-input w-full aspect-square text-center font-headline text-2xl font-bold bg-surface-container-highest border-none rounded-lg text-on-surface" maxlength="1" placeholder="-" type="text"/>
<input autocomplete="one-time-code" class="otp-input w-full aspect-square text-center font-headline text-2xl font-bold bg-surface-container-highest border-none rounded-lg text-on-surface" maxlength="1" placeholder="-" type="text"/>
<input autocomplete="one-time-code" class="otp-input w-full aspect-square text-center font-headline text-2xl font-bold bg-surface-container-highest border-none rounded-lg text-on-surface" maxlength="1" placeholder="-" type="text"/>
<input autocomplete="one-time-code" class="otp-input w-full aspect-square text-center font-headline text-2xl font-bold bg-surface-container-highest border-none rounded-lg text-on-surface" maxlength="1" placeholder="-" type="text"/>
</section>
<!-- Timer & Resend -->
<div class="flex flex-col items-center gap-2 mb-12">
<div class="flex items-center gap-2 text-on-surface-variant font-medium">
<span class="material-symbols-outlined text-lg" style="font-variation-settings: 'FILL' 1;">schedule</span>
<span>Code expires in <span class="text-primary font-bold">01:54</span></span>
</div>
<p class="text-sm text-on-surface-variant opacity-60">Didn't receive the code?</p>
<button class="text-on-surface-variant font-bold opacity-40 cursor-not-allowed" disabled="">Resend Code</button>
</div>
<!-- Primary Action -->
<div class="mt-auto pb-10">
<button class="w-full bg-primary-container text-on-primary-container py-5 rounded-full font-headline font-bold text-lg shadow-[0_24px_48px_-12px_rgba(153,70,42,0.2)] hover:bg-primary transition-all active:scale-95 duration-200">
                Verify &amp; Continue
            </button>
<div class="mt-6 flex items-center justify-center gap-2 text-on-surface-variant/60">
<span class="material-symbols-outlined text-sm">lock</span>
<span class="text-xs uppercase tracking-[0.1em] font-bold">Secure Verification</span>
</div>
</div>
</main>
<!-- Visual Polish: Soft Tonal Layers in Background -->
<div class="fixed top-[-10%] right-[-20%] w-[80%] h-[50%] bg-primary/5 rounded-full blur-[100px] -z-10"></div>
<div class="fixed bottom-[-5%] left-[-10%] w-[60%] h-[40%] bg-tertiary/5 rounded-full blur-[100px] -z-10"></div>
<!-- Security Badge Section (Optional for premium feel) -->
<footer class="w-full bg-on-secondary-fixed text-surface p-8 rounded-t-xl mt-auto">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-white/10 flex items-center justify-center">
<span class="material-symbols-outlined text-white" style="font-variation-settings: 'FILL' 1;">verified_user</span>
</div>
<div>
<p class="text-sm font-bold text-white">Encrypted Session</p>
<p class="text-xs text-slate-400">Your security is our top priority at EvntsApp Egypt.</p>
</div>
</div>
</footer>
</body></html>
