<body class="bg-deep-navy text-on-primary-container font-body min-h-screen flex flex-col items-center justify-center overflow-hidden selection:bg-primary/30">
<!-- Background Accents -->
<div class="fixed inset-0 overflow-hidden pointer-events-none">
<div class="absolute top-[-10%] left-[-20%] w-[80%] h-[60%] rounded-full bg-primary/10 blur-[120px]"></div>
<div class="absolute bottom-[-5%] right-[-10%] w-[60%] h-[50%] rounded-full bg-tertiary/5 blur-[100px]"></div>
</div>
<!-- Main Canvas -->
<main class="relative z-10 w-full max-w-md px-8 py-12 flex flex-col min-h-screen">
<!-- Brand Header Section -->
<header class="flex flex-col items-center text-center mt-8 mb-16">
<div class="mb-6 flex items-center justify-center w-20 h-20 rounded-3xl bg-primary/10 border border-primary/20 shadow-2xl">
<span class="material-symbols-outlined text-primary text-5xl" style="font-variation-settings: 'FILL' 1;">hub</span>
</div>
<h1 class="font-headline font-extrabold text-4xl tracking-tighter text-white mb-2">Stratos Foundry</h1>
<p class="font-body text-on-surface-variant text-sm tracking-wide opacity-80">Precision Event Orchestration</p>
</header>
<!-- Auth Transition Container -->
<div class="flex-1 flex flex-col gap-10">
<!-- Step 1: Phone Input (Initial State) -->
<section class="space-y-6" id="phone-entry">
<div class="space-y-2">
<h2 class="font-headline text-2xl font-bold text-white">Welcome Back</h2>
<p class="text-on-surface-variant text-sm">Enter your phone number to continue</p>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
<span class="text-on-surface-variant font-medium border-r border-outline-variant/20 pr-3">+1</span>
</div>
<input class="w-full bg-surface-container-highest/5 border-none rounded-xl py-4 pl-16 pr-4 text-white placeholder:text-on-surface-variant/40 focus:ring-2 focus:ring-primary/40 transition-all font-medium tracking-widest outline-none" placeholder="000-000-0000" type="tel"/>
</div>
<button class="w-full py-4 bg-gradient-to-br from-primary to-primary-container text-white font-bold rounded-xl shadow-lg shadow-primary/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2 group">
<span>Send Verification Code</span>
<span class="material-symbols-outlined text-xl group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</section>
<!-- Separator -->
<div class="relative py-4">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/10"></div>
</div>
<div class="relative flex justify-center text-xs uppercase tracking-[0.2em] font-bold text-on-surface-variant/40 bg-deep-navy px-4">
                    Or
                </div>
</div>
<!-- Onboarding State / Create Account -->
<section class="space-y-4">
<button class="w-full py-4 border border-outline-variant/20 bg-surface-container-highest/5 text-white font-semibold rounded-xl hover:bg-surface-container-highest/10 transition-colors flex items-center justify-center gap-3">
<span class="material-symbols-outlined text-xl">person_add</span>
<span>Create Professional Profile</span>
</button>
<p class="text-center text-xs text-on-surface-variant/60 px-8 leading-relaxed">
                    By continuing, you agree to our <span class="text-primary font-medium">Terms of Service</span> and <span class="text-primary font-medium">Privacy Policy</span>.
                </p>
</section>
</div>
<!-- Footer / Support -->
<footer class="mt-auto pt-12 pb-4 text-center">
<a class="text-on-surface-variant/40 text-xs font-bold uppercase tracking-widest hover:text-primary transition-colors flex items-center justify-center gap-2" href="#">
<span class="material-symbols-outlined text-sm">help</span>
                Need assistance?
            </a>
</footer>
</main>
<!-- Visual Layer Overlay (OTP Simulation Mock - Floating Toast Style) -->
<div class="fixed bottom-10 left-1/2 -translate-x-1/2 w-[90%] max-w-sm glass-panel border border-primary/10 rounded-2xl p-6 shadow-2xl hidden md:block">
<div class="flex items-center gap-4 mb-4">
<div class="w-10 h-10 rounded-full bg-tertiary/20 flex items-center justify-center">
<span class="material-symbols-outlined text-tertiary-fixed-dim" style="font-variation-settings: 'FILL' 1;">security</span>
</div>
<div>

</div>
</div>
