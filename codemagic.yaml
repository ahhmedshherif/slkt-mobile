workflows:
  android-release:
    name: TKTS APP Android APK & AAB
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      vars:
        API_BASE_URL: "https://tktsapp.com/api/v1"
        ONESIGNAL_APP_ID: "c39ec100-bcb6-4a3f-b07d-12035107cd5e"
        ONESIGNAL_DISABLE_LOCATION: "true"
    cache:
      cache_paths:
        - "$FLUTTER_ROOT/.pub-cache"
        - "$HOME/.gradle/caches"
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Analyze project
        script: flutter analyze
      - name: Run tests
        script: flutter test
      - name: Build release APK and AAB
        script: |
          flutter build apk --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=ONESIGNAL_APP_ID="${ONESIGNAL_APP_ID:-}"
          flutter build appbundle --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=ONESIGNAL_APP_ID="${ONESIGNAL_APP_ID:-}"
    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt
      - flutter_drive.log

  ios-release:
    name: TKTS APP iOS IPA
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tktsapp.jumpersagency
      vars:
        API_BASE_URL: "https://tktsapp.com/api/v1"
        ONESIGNAL_APP_ID: "c39ec100-bcb6-4a3f-b07d-12035107cd5e"
        ONESIGNAL_DISABLE_LOCATION: "true"
    cache:
      cache_paths:
        - "$FLUTTER_ROOT/.pub-cache"
        - "$HOME/Library/Caches/CocoaPods"
    scripts:
      - name: Get Flutter packages
        script: |
          flutter config --no-enable-swift-package-manager
          flutter clean
          flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios
          pod repo update
          pod install
      - name: Configure iOS signing
        script: xcode-project use-profiles
      - name: Analyze project
        script: flutter analyze
      - name: Run tests
        script: flutter test
      - name: Build signed IPA
        script: |
          flutter build ipa --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=ONESIGNAL_APP_ID="${ONESIGNAL_APP_ID:-}" \
            --export-options-plist=/Users/builder/export_options.plist
      - name: Verify signed push entitlements
        script: |
          set -euo pipefail
          ipa_path="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$ipa_path"
          verify_dir="$(mktemp -d)"
          trap 'rm -rf "$verify_dir"' EXIT
          unzip -q "$ipa_path" -d "$verify_dir"

          runner_entitlements="$verify_dir/Runner.entitlements.plist"
          codesign -d --entitlements :- "$verify_dir/Payload/Runner.app" > "$runner_entitlements" 2>/dev/null
          /usr/libexec/PlistBuddy -c 'Print :application-identifier' "$runner_entitlements" | grep -Eq '\.com\.tktsapp\.jumpersagency$'
          /usr/libexec/PlistBuddy -c 'Print :aps-environment' "$runner_entitlements" | grep -qx 'production'
          /usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' "$runner_entitlements" | grep -qx 'group.com.tktsapp.jumpersagency.onesignal'

          extension_path="$verify_dir/Payload/Runner.app/PlugIns/OneSignalNotificationServiceExtension.appex"
          test -d "$extension_path"
          extension_entitlements="$verify_dir/OneSignalExtension.entitlements.plist"
          codesign -d --entitlements :- "$extension_path" > "$extension_entitlements" 2>/dev/null
          /usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' "$extension_entitlements" | grep -qx 'group.com.tktsapp.jumpersagency.onesignal'
          echo 'Verified TKTS APP production APNs and OneSignal app-group entitlements.'
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
