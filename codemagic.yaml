workflows:
  android-release:
    name: TKTS APP Android APK & AAB
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      vars:
        API_BASE_URL: "https://slktegy.com/api/v1"
        ONESIGNAL_APP_ID: "c39ec100-bcb6-4a3f-b07d-12035107cd5e"
        ONESIGNAL_DISABLE_LOCATION: "true"
    cache:
      cache_paths:
        - "$FLUTTER_ROOT/.pub-cache"
        - "$HOME/.gradle/caches"
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Analyze project
        script: flutter analyze
      - name: Run tests
        script: flutter test
      - name: Build release APK and AAB
        script: |
          flutter build apk --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=ONESIGNAL_APP_ID="${ONESIGNAL_APP_ID:-}"
          flutter build appbundle --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=ONESIGNAL_APP_ID="${ONESIGNAL_APP_ID:-}"
    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt
      - flutter_drive.log

  ios-release:
    name: TKTS APP iOS IPA
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: development
        bundle_identifier: com.rahul.group32
      vars:
        API_BASE_URL: "https://slktegy.com/api/v1"
        ONESIGNAL_APP_ID: "c39ec100-bcb6-4a3f-b07d-12035107cd5e"
        ONESIGNAL_DISABLE_LOCATION: "true"
    cache:
      cache_paths:
        - "$FLUTTER_ROOT/.pub-cache"
        - "$HOME/Library/Caches/CocoaPods"
    scripts:
      - name: Get Flutter packages
        script: |
          flutter clean
          flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios
          pod repo update
          pod install
      - name: Configure iOS signing
        script: xcode-project use-profiles
      - name: Analyze project
        script: flutter analyze
      - name: Run tests
        script: flutter test
      - name: Build signed IPA
        script: |
          flutter build ipa --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=ONESIGNAL_APP_ID="${ONESIGNAL_APP_ID:-}" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
